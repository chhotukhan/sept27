services:
  db:
    image: mysql:latest
    env_file:
      - .env
    networks:
      - mynetwork1
    volumes:
      - myvolume1:/var/lib/mysql
  gui:
    image: phpmyadmin:latest
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8080:80"
    networks:
      - mynetwork1
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "9090:80"
    networks:
      - mynetwork1
networks:
  mynetwork1:
volumes:
  myvolume1:  
